name: London Weather - Python and notebook validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Offline unit and notebook structure tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Execute notebook on synthetic test fixture
        run: python tests/run_notebook_smoke.py
